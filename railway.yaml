host: "0.0.0.0"
port: 8080
auth-dir: "/data/auth"
api-keys:
  - "railway-default-key"
debug: false
remote-management:
  allow-remote: true
  secret-key: "railway-default-password"
  disable-control-panel: false
usage-statistics-enabled: true
redis-usage-queue-retention-seconds: 600
logging-to-file: true
logs-max-total-size-mb: 500
error-logs-max-files: 50
